<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>农场地图 - autofarm.json 渲染器</title>
<style>
  body{background:#1b1b1b;color:#ddd;font-family:'Microsoft YaHei',sans-serif;margin:20px}
  h2{margin:0 0 6px 0} small{color:#888}
  #drop{border:2px dashed #555;border-radius:8px;padding:18px;margin:10px 0;color:#aaa;cursor:pointer}
  #drop.hover{border-color:#2ECC71;color:#2ECC71}
  svg{background:#242424;border:1px solid #444;border-radius:6px;display:none}
  .lbl{font-size:13px;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3px;font-weight:bold}
  #coord{margin:8px 0;font-size:15px;color:#9ad;min-height:1.2em}
  .legend{margin:6px 0} .legend span{display:inline-block;margin-right:14px}
  .sw{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:4px}
  button{background:#2d2d2d;color:#ddd;border:1px solid #555;border-radius:5px;padding:6px 14px;cursor:pointer;margin-right:8px}
  button:hover{border-color:#2ECC71}
</style>
</head>
<body>
<h2>农场地图 <small>北↑ · 独立渲染 autofarm.json（zone 色块 + 浇水点）</small></h2>
<div id="drop">把 <b>autofarm.json</b> 拖到这里，或点击选择文件<br>
<small>文件位置: .minecraft/versions/整合包/config/autofarm.json</small></div>
<div>
  <button id="pick" style="display:none">重新选择文件</button>
  <button id="reload" style="display:none">🔄 刷新（重新读取同一文件）</button>
</div>
<div class="legend" id="legend"></div>
<div id="coord"></div>
<svg id="map" width="1300" height="820"></svg>
<input type="file" id="file" accept=".json" style="display:none">

<script>
const PALETTE=['#E74C3C','#F39C12','#F1C40F','#2ECC71','#9B59B6','#E91E63','#1ABC9C','#8D6E63','#7CB342','#FF7043'];
const W=1300,H=820,PAD=44;
const svg=document.getElementById('map'),coord=document.getElementById('coord'),
      drop=document.getElementById('drop'),fileIn=document.getElementById('file'),
      legend=document.getElementById('legend'),btnPick=document.getElementById('pick'),
      btnReload=document.getElementById('reload');
let view=null, fileHandle=null;

drop.onclick=()=>pickFile();
btnPick.onclick=()=>pickFile();
btnReload.onclick=()=>reload();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('hover');};
drop.ondragleave=()=>drop.classList.remove('hover');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('hover');
  const f=e.dataTransfer.files[0]; if(f) f.text().then(t=>render(JSON.parse(t)));};
fileIn.onchange=()=>{const f=fileIn.files[0]; if(f) f.text().then(t=>render(JSON.parse(t)));};

async function pickFile(){
  // Chrome/Edge 支持 File System Access API：记住句柄，之后可一键刷新
  if(window.showOpenFilePicker){
    try{
      const [h]=await showOpenFilePicker({types:[{description:'JSON',accept:{'application/json':['.json']}}]});
      fileHandle=h; await reload(); btnReload.style.display='inline-block';
      return;
    }catch(e){ if(e.name==='AbortError') return; }
  }
  fileIn.click();
}
async function reload(){
  if(!fileHandle) return;
  const f=await fileHandle.getFile();
  render(JSON.parse(await f.text()));
}

function norm(b){return {x1:Math.min(b.x1,b.x2),x2:Math.max(b.x1,b.x2),
                         z1:Math.min(b.z1,b.z2),z2:Math.max(b.z1,b.z2),
                         y1:Math.min(b.y1,b.y2)};}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(cfg){
  const zones=(cfg.zones||[]).filter(z=>z&&z.box);
  const waterers=cfg.waterers||[];
  if(!zones.length&&!waterers.length){coord.textContent='JSON 里没有 zones/waterers';return;}

  // 包围盒
  let minX=1e9,minZ=1e9,maxX=-1e9,maxZ=-1e9;
  for(const z of zones){const b=norm(z.box);
    minX=Math.min(minX,b.x1);minZ=Math.min(minZ,b.z1);
    maxX=Math.max(maxX,b.x2);maxZ=Math.max(maxZ,b.z2);}
  for(const w of waterers){
    minX=Math.min(minX,Math.floor(w.x));minZ=Math.min(minZ,Math.floor(w.z));
    maxX=Math.max(maxX,Math.floor(w.x));maxZ=Math.max(maxZ,Math.floor(w.z));}

  const spanX=Math.max(1,maxX-minX+1),spanZ=Math.max(1,maxZ-minZ+1);
  const s=Math.min((W-PAD*2)/spanX,(H-PAD*2)/spanZ);
  const ox=PAD+((W-PAD*2)-spanX*s)/2, oz=PAD+((H-PAD*2)-spanZ*s)/2;
  const X=x=>ox+(x-minX)*s, Z=z=>oz+(z-minZ)*s;
  view={minX,minZ,s,ox,oz};

  // 作物颜色
  const cropNames=Object.keys(cfg.crops||{});
  const color={}; cropNames.forEach((n,i)=>color[n]=PALETTE[i%PALETTE.length]);
  const enabled=n=>{const c=(cfg.crops||{})[n];return !c||c.enabled!==false;};

  let out='';
  // 区块网格（16 格）
  out+="<g stroke='#3a3a3a' stroke-width='1'>";
  for(let gx=Math.floor(minX/16)*16; gx<=maxX+16; gx+=16)
    out+=`<line x1='${X(gx)}' y1='${PAD}' x2='${X(gx)}' y2='${H-PAD}'/>`;
  for(let gz=Math.floor(minZ/16)*16; gz<=maxZ+16; gz+=16)
    out+=`<line x1='${PAD}' y1='${Z(gz)}' x2='${W-PAD}' y2='${Z(gz)}'/>`;
  out+="</g>";

  // zone 色块
  zones.forEach((z,i)=>{
    const b=norm(z.box), en=enabled(z.crop);
    const c=en?(color[z.crop]||'#95A5A6'):'#616161';
    const x=X(b.x1),y=Z(b.z1),w=(b.x2-b.x1+1)*s,h=(b.z2-b.z1+1)*s;
    const tip=`#${i+1} ${esc(z.crop)} (${b.x1},${b.z1})~(${b.x2},${b.z2}) y${b.y1}${en?'':' [已停用]'}`;
    out+=`<rect x='${x}' y='${y}' width='${w}' height='${h}' fill='${c}55' stroke='${c}' stroke-width='2'><title>${tip}</title></rect>`;
    if(w>50&&h>16)
      out+=`<text class='lbl' x='${x+w/2}' y='${y+h/2+4}' text-anchor='middle'>#${i+1} ${esc(z.crop)}${en?'':'(停)'}</text>`;
  });

  // 浇水点：十字标
  waterers.forEach((w,i)=>{
    const x=X(Math.floor(w.x)+0.5), y=Z(Math.floor(w.z)+0.5);
    const tip=`浇水点#${i+1} (${Math.floor(w.x)}, ${Math.floor(w.y)}, ${Math.floor(w.z)})`;
    out+=`<g stroke='#00E5FF' stroke-width='3'><title>${tip}</title>`
        +`<line x1='${x-7}' y1='${y}' x2='${x+7}' y2='${y}'/>`
        +`<line x1='${x}' y1='${y-7}' x2='${x}' y2='${y+7}'/></g>`
        +`<text class='lbl' x='${x+9}' y='${y-6}' fill='#00E5FF'>水${i+1}</text>`;
  });

  // 角落坐标
  out+=`<text class='lbl' x='${X(minX)}' y='${Z(minZ)-6}' fill='#aaa'>(${minX}, ${minZ})</text>`;
  out+=`<text class='lbl' x='${X(maxX+1)-90}' y='${Z(maxZ+1)+14}' fill='#aaa'>(${maxX}, ${maxZ})</text>`;

  svg.innerHTML=out;
  svg.style.display='block';
  drop.style.display='none';
  btnPick.style.display='inline-block';

  // 图例
  let lg='';
  for(const n of cropNames)
    lg+=`<span><i class='sw' style='background:${enabled(n)?color[n]:'#616161'}'></i>${esc(n)}${enabled(n)?'':'（停用）'}</span>`;
  lg+=`<span><i class='sw' style='background:#00E5FF'></i>浇水点(${waterers.length})</span>`;
  legend.innerHTML=lg;
  coord.textContent='指向: 把鼠标移到地图上';
}

svg.addEventListener('mousemove',e=>{
  if(!view)return;
  const r=svg.getBoundingClientRect();
  const wx=Math.floor(view.minX+(e.clientX-r.left-view.ox)/view.s);
  const wz=Math.floor(view.minZ+(e.clientY-r.top-view.oz)/view.s);
  coord.textContent=`指向: X=${wx}  Z=${wz}`;
});
</script>
</body>
</html>
